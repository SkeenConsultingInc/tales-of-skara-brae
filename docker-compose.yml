# Tales of Skara Brae — local desktop browser hosting
#
#   docker compose up --build
#   open http://localhost:8080
#
services:
  game:
    build:
      context: .
      dockerfile: Dockerfile
    image: tales-of-skara-brae:latest
    container_name: skara-brae
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8080
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=8080
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
